<div class="min-h-screen flex items-center justify-center bg-destinyDark">

        <h1 class="text-4xl font-bold text-gray-100 mb-2 tracking-widest uppercase">
            Pattern <span class="text-destinyGold">Tracker</span>
        </h1>
        <p class="text-gray-400 mb-8 text-sm">
